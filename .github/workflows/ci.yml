name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The dev toolchain requires Node 20+. Test the published CLI separately.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Run contract tests (against built CLI)
        run: npm run test:contract

      - name: Pack published CLI
        if: matrix.node-version == '24.x'
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - uses: actions/upload-artifact@v4
        if: matrix.node-version == '24.x'
        with:
          name: cli-package
          path: ${{ runner.temp }}/agent-add-*.tgz

  runtime:
    name: Published CLI (Node ${{ matrix.node-version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.0.0, 18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli-package
      - name: Test tarball without development dependencies
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/agent-add-runtime.XXXXXX")
          tar -xzf "$RUNNER_TEMP"/cli-package/*.tgz -C "$package_dir"
          AGENT_ADD_BIN="$package_dir/package/bin/agent-add.js" npm run test:runtime
