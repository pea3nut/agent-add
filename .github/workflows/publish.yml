name: Publish to npm

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_NODE: '24.22.2'
  RELEASE_NPM: '11.9.0'

jobs:
  build:
    name: Check version, build and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.RELEASE_NODE }}
      - name: Check release tag matches package version
        id: version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REPOSITORY, 'pea3nut/agent-add');
          assert.equal(pkg.name, 'agent-add');
          assert.equal(process.env.GITHUB_REF, `refs/tags/${pkg.version}`);
          const parts = pkg.version.split('.');
          assert.ok(parts.length === 3 && parts.every((part) => Number.isSafeInteger(Number(part)) && Number(part) >= 0 && String(Number(part)) === part), 'Use a stable version tag without a v prefix');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          JS
      - name: Require the exact commit to be merged into master
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Test, build and pack once
        run: |
          npm install --global --ignore-scripts npm@"$RELEASE_NPM"
          npm ci
          npm run lint
          npm test
          npm run build
          npm run test:contract
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/agent-add-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

  runtime:
    name: Test packed CLI (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['18.0.0', '18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-release
      - name: Test the actual tarball
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/agent-add-runtime.XXXXXX")
          tar -xzf "$RUNNER_TEMP/npm-release/agent-add-$RELEASE_VERSION.tgz" -C "$package_dir"
          AGENT_ADD_BIN="$package_dir/package/bin/agent-add.js" node tests/runtime/cli.test.cjs

  publish:
    name: Publish tested tarball with OIDC
    needs: [build, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.RELEASE_NODE }}
          registry-url: https://registry.npmjs.org
      - name: Pin publishing npm
        run: npm install --global --ignore-scripts npm@"$RELEASE_NPM"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-release
      # Publish the tested artifact without checking out or rebuilding source.
      - name: Publish with npm provenance
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: npm publish "$RUNNER_TEMP/npm-release/agent-add-$RELEASE_VERSION.tgz" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org
